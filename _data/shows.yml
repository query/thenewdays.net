# date: Show date in ISO 8601 format.
# show_url: (Optional) URL of the venue schedule page, Instagram post, etc. for
#           this specific show.
# venue: Venue name.
# venue_url: (Optional) URL of the venue's Web site, Instagram, etc.
# location:
#   en: English name of the venue's location.
#   ja: Japanese name of same.
# event: (Optional) Name of the event or series the show is part of.
# times: (Optional) Doors and start times, as printed on the flyer.
#   open: Doors time, e.g. "18:00".
#   start: Start time.
#   stage: Our own set time, if it is known.
# tickets: (Optional) Prices, written out.
#   en: English wording.
#   ja: Japanese wording.
# lineup: (Optional) The other artists on the bill, comma separated.
# details: Extra description; e.g., "Acoustic set."

