# date: Show date in ISO 8601 format.
# show_url: (Optional) URL of the venue schedule page, Instagram post, etc. for
#           this specific show.
# venue: Venue name.
# venue_url: (Optional) URL of the venue's Web site, Instagram, etc.
# location:
#   en: English name of the venue's location.
#   ja: Japanese name of same.
# extra: (Optional) Extra description; e.g., "Acoustic set."
#
# The rest is shown on /live/ only, and every field is optional. Take the
# values from the venue's official flyer.
#
# event: Name of the event or series the show is part of.
# times: Times as printed on the flyer.
#   open: Doors.
#   start: Start of the first act.
#   stage: When we are on, if it is known.
# tickets: Prices, written out.
#   en: English wording.
#   ja: Japanese wording.
# ticket_url: Where to actually buy one.
# lineup: The other artists on the bill, comma separated.

